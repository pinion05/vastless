<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vastless</title>
<style>
:root{--bg:#0b0e14;--card:#141a24;--line:#232c3b;--tx:#e6edf3;--mut:#8b98a9;--acc:#4f8cff;--ok:#3fb950;--warn:#d29922;--err:#f85149}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,'Segoe UI','Noto Sans KR',sans-serif;padding:24px;max-width:920px;margin:0 auto}
h1{font-size:20px;margin-bottom:2px}.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stat{display:inline-flex;gap:7px;align-items:center;background:var(--bg);border:1px solid var(--line);padding:7px 12px;border-radius:8px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.none{background:var(--mut)}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
button.stop{background:var(--err)}button.ghost{background:var(--line);color:var(--tx)}
button:disabled{opacity:.4;cursor:wait}button.sel{padding:4px 10px;font-size:12px;background:transparent;border:1px solid var(--acc);color:var(--acc)}
.hint{color:var(--mut);font-size:12px;margin-top:8px}
.gauge{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.gauge>div{height:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--err))}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px}
td{padding:7px 8px;border-bottom:1px solid #1b2230}
tr.pinned td{background:#16203a}
.badge{font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--mut)}
.badge.same{color:var(--ok);border-color:var(--ok)}.badge.reseed{color:var(--warn);border-color:var(--warn)}
#events{font:12px/1.7 ui-monospace,monospace;color:var(--mut);max-height:180px;overflow-y:auto}
#events .e{white-space:nowrap}
.urlbox{display:flex;gap:8px;margin-top:10px}
.urlbox input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 12px;font:13px ui-monospace,monospace}
.copy{background:var(--line);color:var(--tx);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:12px}
#chatcard{display:flex;flex-direction:column;height:360px}
#chatlog{flex:1;overflow-y:auto;margin-top:10px;padding-right:6px}
#chatin{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px 12px;font-size:14px}
</style></head><body>
<h1>vastless</h1>
<div class="sub">serverless OpenAI LLM on vast.ai spot GPU — budget auto-search · fallback chain · reseed</div>

<div class="card">
  <div class="row spread">
    <div class="row" id="stats"></div>
    <div class="row">
      <button id="btnLaunch">🚀 Serve</button>
      <button id="btnStop" class="stop" style="display:none">■ Stop</button>
      <button id="btnChain" class="ghost">↻ 후보 갱신</button>
    </div>
  </div>
  <div class="gauge"><div id="spendbar" style="width:0%"></div></div>
  <div class="hint" id="detail"></div>
</div>

<div class="card">
  <div class="row spread"><b>오퍼 체인</b><span class="hint" style="margin:0" id="chainmeta"></span></div>
  <table><thead><tr><th>GPU</th><th>$/hr</th><th>VRAM</th><th>rel</th><th>위치</th><th>유형</th><th></th></tr></thead>
  <tbody id="chain"></tbody></table>
  <div class="hint">같은머신=시딩된 볼륨 즉시 사용(콜드 ~40s) · 재시딩=신규 볼륨+빌드(10~20분, 일회성). '선택'하면 다음 런치부터 그 오퍼 우선.</div>
</div>

<div class="card">
  <b>이벤트 (실시간)</b>
  <div id="events" style="margin-top:8px"></div>
</div>

<div class="card">
  <b>OpenAI 호환 API</b>
  <div class="urlbox"><input id="apiurl" readonly><button class="copy" onclick="cp(this)">복사</button></div>
</div>

<div class="card" id="chatcard">
  <b>💬 Chat</b>
  <div id="chatlog"></div>
  <div class="row" style="margin-top:10px">
    <input id="chatin" placeholder="메시지 (Enter)"><button id="btnSend">전송</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const PHASE={idle:['none','정지 — 첫 호출에 자동 런치'],launching:['warn','런치 중…'],
  seeding:['warn','재시딩 중… (10~20분)'],ready:['ok','READY — API 사용 가능'],failed:['err','실패 — 후보 갱신 후 재시도']};
const history=[];
function fmt(s){return s<60?Math.round(s)+'초':s<3600?Math.floor(s/60)+'분':Math.floor(s/3600)+'시간 '+Math.floor(s%3600/60)+'분'}
function addMsg(role,text){const el=document.createElement('div');el.style.cssText='margin:6px 0;display:flex;'+(role==='user'?'justify-content:flex-end':'');
  const b=document.createElement('div');b.style.cssText='max-width:78%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;font-size:14px;'+
    (role==='user'?'background:var(--acc);color:#fff':'background:var(--bg);border:1px solid var(--line)');
  b.textContent=text;el.appendChild(b);$('chatlog').appendChild(el);$('chatlog').scrollTop=1e9;}
async function send(){const q=$('chatin').value.trim();if(!q)return;$('chatin').value='';addMsg('user',q);history.push({role:'user',content:q});
  addMsg('assistant','…');const last=$('chatlog').lastChild.firstChild;const t0=performance.now();
  try{const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'nex',messages:history.slice(-20),max_tokens:1024,temperature:0.7})});
    const d=await r.json();
    if(d.choices){history.push({role:'assistant',content:d.choices[0].message.content});
      last.textContent=d.choices[0].message.content+'  ·  '+((performance.now()-t0)/1000).toFixed(1)+'s';}
    else last.textContent='에러: '+JSON.stringify(d).slice(0,180);
  }catch(e){last.textContent='에러: '+e.message;} poll();}
$('btnSend').onclick=send;
$('chatin').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)send()});
function render(s){
  const [dc,dt]=PHASE[s.phase]||['none',s.phase];
  $('stats').innerHTML=`<span class="stat"><span class="dot ${dc}"></span>${dt}</span>`+
    (s.instance&&s.instance.dph?`<span class="stat">$${s.instance.dph.toFixed(3)}/hr</span>`:'')+
    (s.instance&&s.instance.since?`<span class="stat">⏱ ${fmt((Date.now()-s.instance.since)/1000)}</span>`:'')+
    `<span class="stat">💰 누적 $${(s.budget.spent_usd||0).toFixed(3)} · cap $${s.budget.max_usd_hr}/hr</span>`+
    (s.instance?`<span class="stat">${s.instance.ip}:${s.instance.port}</span>`:'');
  $('spendbar').style.width=Math.min(100,(s.budget.spent_usd||0)*10)+'%';
  $('detail').textContent=s.err?s.err:(s.volume.id?`볼륨 ${s.volume.id} (머신 ${s.volume.machine_id??'?'}) · 모델 ${s.volume.seeded_model||'시딩 안됨'}`:'볼륨 미구성 — npx @npmc_5/vastless init 먼저');
  $('btnStop').style.display=s.instance?'':'none';
  $('btnLaunch').disabled=['ready','launching','seeding'].includes(s.phase);
  const rows=(s.chain||[]).map(o=>{
    const pin=s.pinned_offer===o.offer_id;
    return `<tr class="${pin?'pinned':''}"><td>${o.gpu}</td><td>$${o.usd_hr.toFixed(3)}</td><td>${o.vram_gb}GB</td>`+
    `<td>${o.reliability.toFixed(2)}</td><td>${o.geo}</td>`+
    `<td><span class="badge ${o.same_machine?'same':'reseed'}">${o.same_machine?'같은머신':'재시딩'}</span></td>`+
    `<td><button class="sel" onclick="sel(${o.offer_id})">${pin?'선택됨':'선택'}</button></td></tr>`;}).join('');
  $('chain').innerHTML=rows||'<tr><td colspan="7" style="color:var(--mut)">후보 없음 — ↻ 후보 갱신 눌러 탐색</td></tr>';
  $('chainmeta').textContent=(s.chain||[]).length?`${s.chain.length}후보 · 예산 ≤$${s.budget.max_usd_hr}/hr`:'';
  $('events').innerHTML=(s.events||[]).slice(-25).reverse().map(e=>`<div class="e">${e.ts} ${e.msg}</div>`).join('');
  $('apiurl').value=location.origin+'/v1';
}
async function poll(){try{render(await(await fetch('/api/status')).json())}catch(e){}}
async function sel(id){await fetch('/api/select',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offer_id:id})});poll();}
$('btnLaunch').onclick=async()=>{$('btnLaunch').disabled=true;addMsg('assistant','[런치 요청 — 체인 순회 중… (상태/이벤트 카드 확인)]');
  try{await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'nex',messages:[{role:'user',content:'ping'}],max_tokens:1})})}catch(e){} poll();};
$('btnStop').onclick=async()=>{await fetch('/api/stop',{method:'POST'});poll()};
$('btnChain').onclick=async()=>{$('btnChain').disabled=true;try{render(await(await fetch('/api/chain')).json())}catch(e){}$('btnChain').disabled=false};
function cp(b){navigator.clipboard.writeText($('apiurl').value);b.textContent='복사됨';setTimeout(()=>b.textContent='복사',1200)}
poll();setInterval(poll,3000);
</script></body></html>
