name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # workflow 전용, 자동 만료 — PAT 불필요

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — pull the pushed image and probe /v1/models
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker pull "$TAG"
          CID=$(docker run -d -p 18790:8790 "$TAG")
          sleep 5
          for i in 1 2 3 4 5 6; do
            if curl -sf -m 5 http://127.0.0.1:18790/v1/models > /tmp/models.json; then break; fi
            sleep 5
          done
          cat /tmp/models.json
          grep -q '"id"' /tmp/models.json || { docker logs "$CID"; exit 1; }
          docker rm -f "$CID"
